openapi: 3.0.3
info:
  title: Telemetry Service API
  description: API для работы с телеметрическими данными
  version: 1.0.0
servers:
  - url: https://api.example.com/telemetry
paths:
  /data:
    get:
      summary: Получение телеметрических данных
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
          description: ID устройства
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Начало периода
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Конец периода
      responses:
        '200':
          description: Телеметрические данные
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                      example: "2025-01-23T10:00:00Z"
                    value:
                      type: number
                      example: 42.5
  /devices/{deviceId}/status:
    get:
      summary: Получение текущего статуса устройства
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Статус устройства
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                    example: device_id
                  status:
                    type: string
                    example: "active"
